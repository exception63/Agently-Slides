<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0c">
<title>Slidesmith 遥控</title>
<style>
  :root { --bg:#0a0a0c; --panel:#16161c; --panel2:#1e1e26; --line:#2a2a34; --fg:#f4f4f6; --dim:#9a9aa6; --amber:#f5b73f; --green:#39d353; --red:#ff5a5a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:-apple-system,system-ui,"PingFang SC",sans-serif; overflow:hidden; overscroll-behavior:none; }
  body { display:flex; flex-direction:column; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 14px; font-size:13px; }
  #status { display:flex; align-items:center; gap:7px; font-weight:600; min-width:0; }
  #statusText { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #dot { width:9px; height:9px; border-radius:50%; background:var(--amber); box-shadow:0 0 8px currentColor; color:var(--amber); flex:none; }
  #dot.ok { background:var(--green); color:var(--green); } #dot.bad { background:var(--red); color:var(--red); }
  /* 模式切换：遥控 / 讲稿 —— 镜像投屏时用讲稿模式，这块屏就是你的演讲者视图 */
  #modes { display:flex; gap:4px; background:var(--panel); border-radius:999px; padding:3px; flex:none; }
  #modes button { border:none; background:none; color:var(--dim); font:600 13px/1 -apple-system,system-ui,"PingFang SC",sans-serif; padding:8px 15px; border-radius:999px; }
  #modes button.on { background:var(--panel2); color:var(--amber); }
  #warn { margin:0 12px 8px; padding:9px 12px; border-radius:12px; background:#3a2a12; color:var(--amber); font-size:12.5px; line-height:1.5; display:none; }
  #warn.show { display:block; }
  .pane { flex:1; display:none; flex-direction:column; min-height:0; }
  .pane.on { display:flex; }

  /* ——— 遥控模式 ——— */
  #padPane main { flex:1; display:flex; gap:10px; padding:6px 12px 12px; min-height:0; }
  .page { flex:1; border:none; border-radius:22px; background:var(--panel); color:var(--fg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; font-size:15px; letter-spacing:.06em; transition:transform .06s, background .15s; }
  .page:active { transform:scale(.97); background:var(--panel2); }
  .page .arrow { font-size:76px; line-height:1; font-weight:300; }
  .page.next { background:linear-gradient(160deg,#26262f,#191921); } .page.next:active { background:#2f2f3a; }
  #padPane footer { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; padding:0 12px calc(12px + env(safe-area-inset-bottom)); }
  .tool { border:1px solid var(--line); border-radius:16px; background:var(--panel); color:var(--fg); padding:14px 4px; font-size:13px; display:flex; flex-direction:column; align-items:center; gap:5px; transition:transform .06s, background .15s; }
  .tool:active { transform:scale(.95); background:var(--panel2); } .tool .ic { font-size:22px; line-height:1; } .tool.on { border-color:var(--amber); color:var(--amber); }

  /* ——— 讲稿模式（演讲者视图）——— */
  #scriptBar { display:flex; align-items:stretch; gap:12px; margin:0 12px 8px; padding:10px 14px; background:var(--panel); border-radius:16px; }
  #scriptBar .col { min-width:0; }
  #scriptBar .col.grow { flex:1; }
  .lbl { font-size:10.5px; letter-spacing:.12em; color:var(--dim); text-transform:uppercase; }
  #curTitle { font-size:17px; font-weight:700; line-height:1.3; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #nextTitle { font-size:12.5px; color:var(--dim); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #pageNo { font:700 22px/1 "SF Mono",Menlo,monospace; margin-top:3px; }
  #timer { font:700 22px/1 "SF Mono",Menlo,monospace; color:var(--green); margin-top:3px; letter-spacing:1px; }
  #timer.paused { color:var(--dim); }
  .col.tap { border-left:1px solid var(--line); padding-left:12px; text-align:center; }
  #scriptWrap { flex:1; margin:0 12px; border-radius:16px; overflow:hidden; background:#FAF6EE; min-height:0; position:relative; }
  #scriptFrame { width:100%; height:100%; border:none; display:block; }
  #scriptEmpty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:28px; color:#6b6b73; font-size:14px; line-height:1.7; background:#FAF6EE; }
  #scriptNav { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; padding:10px 12px calc(12px + env(safe-area-inset-bottom)); }
  #scriptNav button { border:1px solid var(--line); border-radius:16px; background:var(--panel); color:var(--fg); padding:16px 4px; font-size:15px; font-weight:600; transition:transform .06s, background .15s; }
  #scriptNav button:active { transform:scale(.96); background:var(--panel2); }
  #scriptNav button.on { border-color:var(--amber); color:var(--amber); }

  /* ——— 问答模式（主持视图）———
     讲到问答页时 iPad 自动切过来：低头就能读全部问题，三颗键控制大屏。 */
  #qaBar { display:flex; align-items:center; gap:10px; margin:0 12px 8px; padding:10px 14px; background:var(--panel); border-radius:16px; }
  #qaBar .n { font:700 24px/1 "SF Mono",Menlo,monospace; color:var(--amber); }
  #qaBar .lbl2 { font-size:12.5px; color:var(--dim); }
  #qaBar .grow { flex:1; }
  #qaBar .st { font-size:12px; color:var(--dim); display:flex; align-items:center; gap:6px; }
  #qaBar .st i { width:8px; height:8px; border-radius:50%; background:var(--dim); display:block; }
  #qaBar .st i.ok { background:var(--green); } #qaBar .st i.bad { background:var(--red); }
  #qaList { flex:1; margin:0 12px; overflow:auto; -webkit-overflow-scrolling:touch; min-height:0;
    display:flex; flex-direction:column; gap:9px; padding-bottom:4px; }
  .qitem { background:var(--panel); border-radius:14px; padding:13px 15px; display:flex; gap:12px; align-items:flex-start; }
  .qitem .qt { flex:1; font-size:16px; line-height:1.55; color:var(--fg); word-break:break-word; }
  .qitem .qx { flex:none; border:1px solid var(--line); border-radius:10px; background:none; color:var(--dim);
    font-size:12px; padding:7px 10px; }
  .qitem .qx:active { background:var(--panel2); color:var(--fg); }
  .qitem.done { opacity:.45; }
  .qitem .qm { font:11px/1 "SF Mono",Menlo,monospace; color:var(--dim); margin-top:7px; letter-spacing:.08em; }
  #qaEmptyR { flex:1; display:flex; align-items:center; justify-content:center; text-align:center;
    color:var(--dim); font-size:14px; line-height:1.8; padding:30px; }
  #qaNav { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:8px; padding:10px 12px calc(12px + env(safe-area-inset-bottom)); }
  #qaNav button { border:1px solid var(--line); border-radius:16px; background:var(--panel); color:var(--fg);
    padding:16px 4px; font-size:15px; font-weight:600; transition:transform .06s, background .15s; }
  #qaNav button:active { transform:scale(.96); background:var(--panel2); }
  #qaNav button.danger { color:var(--red); border-color:#4a2222; }
  #qaNav button.on { border-color:var(--amber); color:var(--amber); }
  #mQa { display:none; } #mQa.show { display:block; }
  #mQa .badge { display:inline-block; min-width:17px; padding:0 5px; margin-left:5px; border-radius:9px;
    background:var(--amber); color:#181818; font:700 11px/17px -apple-system,system-ui,sans-serif; vertical-align:1px; }
</style>
</head>
<body>
  <header>
    <div id="status"><span id="dot"></span><span id="statusText">连接中…</span></div>
    <div id="modes">
      <button id="mPad" class="on">遥控</button>
      <button id="mScript">讲稿</button>
      <button id="mQa">问答<span class="badge" id="qaBadge" style="display:none">0</span></button>
    </div>
  </header>
  <div id="warn">已连上中转，但<b>放映端还没打开</b>。请在电脑上打开这份 slides 并点「手机遥控」。</div>

  <!-- 遥控模式 -->
  <div class="pane on" id="padPane">
    <main>
      <button class="page prev" data-a="prev"><span class="arrow">‹</span><span>上一页</span></button>
      <button class="page next" data-a="next"><span class="arrow">›</span><span>下一页</span></button>
    </main>
    <footer>
      <button class="tool" data-a="first"><span class="ic">⤒</span><span>首页</span></button>
      <button class="tool" data-a="last"><span class="ic">⤓</span><span>末页</span></button>
      <button class="tool" id="blackBtn" data-a="black"><span class="ic">◼</span><span>黑屏</span></button>
      <button class="tool" data-a="present"><span class="ic">▦</span><span>放映态</span></button>
    </footer>
  </div>

  <!-- 讲稿模式 = 这块屏就是演讲者视图（镜像投屏时的唯一落点）-->
  <div class="pane" id="scriptPane">
    <div id="scriptBar">
      <div class="col grow">
        <div class="lbl">当前</div>
        <div id="curTitle">—</div>
        <div id="nextTitle">› 下一张：—</div>
      </div>
      <div class="col tap"><div class="lbl">页</div><div id="pageNo">—</div></div>
      <div class="col tap"><div class="lbl">计时</div><div id="timer">00:00</div></div>
    </div>
    <div id="scriptWrap">
      <iframe id="scriptFrame" title="讲稿"></iframe>
      <div id="scriptEmpty">等放映端把讲稿推过来…<br><span style="font-size:12.5px">若这份 slides 没有嵌讲稿，这里会一直空着——<br>讲稿模式需要「一体版」（讲稿已缝进同一个 HTML）。</span></div>
    </div>
    <div id="scriptNav">
      <button data-a="prev">‹ 上一页</button>
      <button id="cueBtn">✦ 提词</button>
      <button data-a="next">下一页 ›</button>
    </div>
  </div>

  <!-- 问答模式 = 主持视图：全部问题在手边，三颗键控制大屏 -->
  <div class="pane" id="qaPane">
    <div id="qaBar">
      <div><div class="lbl2">现场提问</div><div class="n" id="qaN">0</div></div>
      <div class="grow"></div>
      <div class="st"><i id="qaDotR"></i><span id="qaStatR">未连接</span></div>
    </div>
    <div id="qaList"><div id="qaEmptyR">还没有人提问。<br>大屏上的二维码扫一下就能提。</div></div>
    <div id="qaNav">
      <button id="qaUp">大屏 ⬆</button>
      <button id="qaDown">大屏 ⬇</button>
      <button id="qaClose">关闭提问</button>
      <button id="qaClear" class="danger">清屏</button>
    </div>
  </div>

<script>
  var ROOM = __ROOM__;
  // 问答面板**默认就在**。原来要 ?qa=1 才出现——那等于"漏一个参数就没有这个功能"，
  // 现场没人记得住 URL。房间没开问答时它只是空着，没有代价。想关掉用 ?qa=0。
  // 问答页锚点由放映端在 deck-info 里告知（window.__SM_QA_ANCHOR__），不用手填。
  var QP = new URLSearchParams(location.search);
  var QA_ON = QP.get('qa') !== '0';
  var QA_ANCHOR = QP.get('qaAnchor') || '';
  var qaAutoFrom = null;   // 自动切进问答前停在哪个模式，翻走了好切回去
  var dot = document.getElementById('dot'), stext = document.getElementById('statusText'), warn = document.getElementById('warn');
  var blackOn = false, ws = null, deckPresent = false;
  // WebRTC 直连（P2P）——手机是 answerer；连上后指令走数据通道，否则回落 WS 云中转
  var pc = null, dc = null, p2p = false, pendingIce = [];
  var ICE = [{ urls: 'stun:stun.l.google.com:19302' }];

  function wsUrl() {
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    return proto + '//' + location.host + '/ws?room=' + encodeURIComponent(ROOM) + '&role=remote';
  }
  function setState(kind, text) { dot.className = (kind==='ok')?'ok':(kind==='bad'?'bad':''); stext.textContent = text; }
  function connLabel() { return deckPresent ? ('已连接放映端 · ' + (p2p ? '直连' : '云端')) : '等待放映端'; }
  function reflectPeers(peers) {
    deckPresent = peers && peers.deck > 0;
    if (deckPresent) { setState('ok', connLabel()); warn.classList.remove('show'); askInfo(); }
    else { setState('', '等待放映端'); warn.classList.add('show'); p2p = false; closePc(); }
  }
  function signal(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'signal', kind: obj.kind, data: obj.data })); }
  function closePc() { try { if (dc) dc.close(); if (pc) pc.close(); } catch (e) {} dc = null; pc = null; }

  function onOffer(sdp) {
    closePc(); p2p = false;
    pc = new RTCPeerConnection({ iceServers: ICE });
    pc.onicecandidate = function (e) { if (e.candidate) signal({ kind: 'ice', data: e.candidate }); };
    pc.ondatachannel = function (e) {
      dc = e.channel;
      dc.onopen = function () { p2p = true; if (deckPresent) setState('ok', connLabel()); };
      dc.onclose = function () { p2p = false; if (deckPresent) setState('ok', connLabel()); };
      // 直连是双向的：讲稿和翻页状态现在优先走这条道（不出局域网），
      // 所以这边必须听。原来只有「手机 → deck」单向，忘了听就等于直连一建立
      // 讲稿屏就再也不更新了。
      dc.onmessage = function (ev) { var m; try { m = JSON.parse(ev.data); } catch (x) { return; } onDeckMsg(m); };
    };
    pc.setRemoteDescription(new RTCSessionDescription(sdp)).then(function () {
      pendingIce.forEach(function (c) { try { pc.addIceCandidate(c); } catch (e) {} }); pendingIce = [];
      return pc.createAnswer();
    }).then(function (ans) { return pc.setLocalDescription(ans).then(function () { signal({ kind: 'answer', data: ans }); }); })
      .catch(function () {});
  }
  function onIce(cand) {
    if (!pc || !pc.remoteDescription) { pendingIce.push(cand); return; }
    try { pc.addIceCandidate(cand); } catch (e) {}
  }

  // ——————————————————————————————————————————————————————
  // 讲稿模式：放映端把整份讲稿（base64）推过来一次，之后每翻一页只来一个状态对象。
  // 讲稿本体就是 deck 里那份，用的也是同一套 postMessage 契约(fuquan-scroll/cue)，
  // 所以这块屏跟电脑上弹出的副窗看到的是同一个东西——只是它长在另一台设备上，
  // 于是镜像投屏也拆不散它。
  // ——————————————————————————————————————————————————————
  var frame = document.getElementById('scriptFrame'), emptyHint = document.getElementById('scriptEmpty');
  var curTitle = document.getElementById('curTitle'), nextTitle = document.getElementById('nextTitle');
  var pageNo = document.getElementById('pageNo'), timerEl = document.getElementById('timer');
  var scriptLoaded = false, cueOn = false, lastAnchor = null, pendingState = null;

  // 要讲稿要要到手为止。原来只问一次，那一次丢了（半开的直连、握手竞态、切后台）
  // 讲稿就永远空着——现场没法等「过一会儿自己好」。改成每 2 秒重问，拿到即停。
  var askTimer = null;
  function askInfo() {
    if (scriptLoaded) return;
    sendRaw({ type: 'need-info' });
    if (askTimer) return;
    var tries = 0;
    askTimer = setInterval(function () {
      if (scriptLoaded || ++tries > 15) { clearInterval(askTimer); askTimer = null; return; }
      if (deckPresent) sendRaw({ type: 'need-info' });
    }, 2000);
  }
  // 放映端发来的东西：两条路（中转 ws / 直连 dc）进来的都走这里
  function onDeckMsg(m) {
    if (!m) return;
    if (m.type === 'deck-info') {
      loadScript(m.txb64);
      // 放映端顺便告诉我们「问答页是哪一张」，翻到那张就自动切到问答面板
      if (m.qaAnchor && !QP.get('qaAnchor')) QA_ANCHOR = m.qaAnchor;
      if (m.state) { applyState(m.state); startTimer(); }
    }
    else if (m.type === 'state') { applyState(m.state); startTimer(); }
  }
  function toFrame(msg) { try { frame.contentWindow.postMessage(msg, '*'); } catch (e) {} }

  function loadScript(txb64) {
    if (scriptLoaded || !txb64) return;
    var html;
    try { html = new TextDecoder().decode(Uint8Array.from(atob(txb64), function (c) { return c.charCodeAt(0); })); }
    catch (e) { return; }
    frame.srcdoc = html;
    scriptLoaded = true;
    emptyHint.style.display = 'none';
    // srcdoc 解析完才收得到 postMessage；补一次当前锚点
    frame.addEventListener('load', function () {
      if (cueOn) toFrame({ type: 'fuquan-cue', on: true });
      if (lastAnchor) toFrame({ type: 'fuquan-scroll', anchor: lastAnchor });
      else if (pendingState) applyState(pendingState);
    });
  }
  function applyState(s) {
    if (!s || typeof s.slideIdx !== 'number') return;
    pendingState = s;
    curTitle.textContent = s.title || '—';
    nextTitle.textContent = '› 下一张：' + (s.nextTitle || '—');
    pageNo.textContent = (s.slideIdx + 1) + (typeof s.total === 'number' ? ' / ' + s.total : '');
    if (s.anchor) { lastAnchor = s.anchor; if (scriptLoaded) toFrame({ type: 'fuquan-scroll', anchor: s.anchor }); }
    // 翻到问答页 → iPad 自动切到「问答」；翻走了自动切回原来那个模式。
    // 讲者手上不用做任何动作，这是用户点名要的那条。
    if (QA_ON && QA_ANCHOR) {
      if (s.anchor === QA_ANCHOR && mode !== 'qa') { qaAutoFrom = mode; setMode('qa'); }
      else if (s.anchor !== QA_ANCHOR && mode === 'qa' && qaAutoFrom) { var back = qaAutoFrom; qaAutoFrom = null; setMode(back); }
    }
  }

  // 计时：第一次收到状态就开始跑（= 你真正开讲的时刻）
  var t0 = null, timerTick = null;
  function startTimer() {
    if (timerTick) return;
    t0 = Date.now();
    timerTick = setInterval(function () {
      var s = Math.floor((Date.now() - t0) / 1000);
      var mm = Math.floor(s / 60), ss = s % 60;
      timerEl.textContent = (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss;
    }, 500);
  }
  timerEl.addEventListener('click', function () { t0 = Date.now(); });   // 点一下归零

  function connect() {
    setState('', '连接中…');
    ws = new WebSocket(wsUrl());
    ws.onopen = function () { setState('', '等待放映端'); };
    ws.onmessage = function (e) { var m; try { m = JSON.parse(e.data); } catch (x) { return; }
      if (m.type === 'joined' || m.type === 'peer') reflectPeers(m.peers);
      else if (m.type === 'signal') { if (m.kind === 'offer') onOffer(m.data); else if (m.kind === 'ice') onIce(m.data); }
      else onDeckMsg(m);
    };
    ws.onclose = function () { setState('bad', '连接断开，重连中…'); setTimeout(connect, 1500); };
    ws.onerror = function () { try { ws.close(); } catch (x) {} };
  }
  connect();

  function haptic() { try { navigator.vibrate && navigator.vibrate(12); } catch (e) {} }
  function sendRaw(obj) {
    var msg = JSON.stringify(obj);
    if (dc && dc.readyState === 'open') { try { dc.send(msg); return; } catch (e) {} }   // 直连优先
    if (ws && ws.readyState === 1) ws.send(msg);                                          // 回落云中转
  }
  function cmd(action) { sendRaw({ type: 'cmd', action: action }); }

  document.querySelectorAll('[data-a]').forEach(function (el) {
    el.addEventListener('click', function () {
      var a = el.getAttribute('data-a'); haptic();
      if (a === 'black') { blackOn = !blackOn; document.getElementById('blackBtn').classList.toggle('on', blackOn); }
      cmd(a);
    });
  });
  document.getElementById('cueBtn').addEventListener('click', function () {
    cueOn = !cueOn; haptic();
    this.classList.toggle('on', cueOn);
    toFrame({ type: 'fuquan-cue', on: cueOn });
  });

  // 模式切换（三态：遥控 / 讲稿 / 问答）
  var mPad = document.getElementById('mPad'), mScript = document.getElementById('mScript'), mQa = document.getElementById('mQa');
  var padPane = document.getElementById('padPane'), scriptPane = document.getElementById('scriptPane'), qaPane = document.getElementById('qaPane');
  var mode = 'pad';
  function setMode(m) {
    if (m === true) m = 'script'; else if (m === false) m = 'pad';   // 兼容旧的布尔调用
    if (m === 'qa' && !QA_ON) m = 'script';
    mode = m;
    mPad.classList.toggle('on', m === 'pad'); mScript.classList.toggle('on', m === 'script'); mQa.classList.toggle('on', m === 'qa');
    padPane.classList.toggle('on', m === 'pad'); scriptPane.classList.toggle('on', m === 'script'); qaPane.classList.toggle('on', m === 'qa');
    try { localStorage.setItem('sm-remote-mode', m); } catch (e) {}
    // 讲稿面板隐藏时 iframe 高度是 0，那期间收到的滚动指令等于打空枪。
    // 所以每次切回讲稿都要按最后一次状态重新定位，否则你切过去看到的是上一次的位置。
    if (m === 'script') {
      askInfo();
      setTimeout(function () {
        if (lastAnchor) toFrame({ type: 'fuquan-scroll', anchor: lastAnchor });
        if (cueOn) toFrame({ type: 'fuquan-cue', on: true });
      }, 120);
    }
  }
  mPad.addEventListener('click', function () { setMode('pad'); });
  mScript.addEventListener('click', function () { setMode('script'); });
  mQa.addEventListener('click', function () { setMode('qa'); });
  try { var sv = localStorage.getItem('sm-remote-mode'); if (sv === 'script' || sv === 'qa') setMode(sv); } catch (e) {}

  // ══════════════ 问答主持视图 ══════════════
  // 独立的一条 WS（role=host），和遥控那条互不影响：遥控断了问题照收，反之亦然。
  // 只在链接带 ?qa=1 时出现，所以对不做问答的 deck 零影响。
  var qaList = document.getElementById('qaList'), qaEmptyR = document.getElementById('qaEmptyR');
  var qaN = document.getElementById('qaN'), qaBadge = document.getElementById('qaBadge');
  var qaDotR = document.getElementById('qaDotR'), qaStatR = document.getElementById('qaStatR');
  var qaCloseBtn = document.getElementById('qaClose'), qaClearBtn = document.getElementById('qaClear');
  var qws = null, qtries = 0, qItems = [], qClosed = false, qDone = {}, qSeen = 0;

  if (QA_ON) mQa.classList.add('show');

  function qaRender() {
    qaN.textContent = String(qItems.length);
    var unseen = Math.max(0, qItems.length - qSeen);
    qaBadge.textContent = String(unseen);
    qaBadge.style.display = (unseen > 0 && mode !== 'qa') ? '' : 'none';
    qaList.innerHTML = '';
    if (!qItems.length) { qaList.appendChild(qaEmptyR); return; }
    // 新的在上：讲者是从上往下扫的
    qItems.slice().reverse().forEach(function (q) {
      var row = document.createElement('div'); row.className = 'qitem' + (qDone[q.id] ? ' done' : '');
      var col = document.createElement('div'); col.style.flex = '1';
      var t = document.createElement('div'); t.className = 'qt'; t.textContent = q.t;
      var m = document.createElement('div'); m.className = 'qm';
      var dt = new Date(q.ts); m.textContent = ('0' + dt.getHours()).slice(-2) + ':' + ('0' + dt.getMinutes()).slice(-2);
      col.appendChild(t); col.appendChild(m);
      var x = document.createElement('button'); x.className = 'qx'; x.textContent = '隐藏';
      x.addEventListener('click', function () { qSend({ type: 'qa-hide', id: q.id }); });
      row.appendChild(col); row.appendChild(x);
      // 点一下标记「已答」——只是本机的视觉记号，不动大屏
      col.addEventListener('click', function () { qDone[q.id] = !qDone[q.id]; qaRender(); });
      qaList.appendChild(row);
    });
  }
  function qSend(o) { try { if (qws && qws.readyState === 1) qws.send(JSON.stringify(o)); } catch (e) {} }
  function qaState(cls, text) { qaDotR.className = cls || ''; qaStatR.textContent = text; }
  function qConnect() {
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    try { qws = new WebSocket(proto + '//' + location.host + '/ws?room=' + encodeURIComponent(ROOM) + '&role=host'); }
    catch (e) { qRetry(); return; }
    qws.onopen = function () { qtries = 0; qaState('ok', '已连接'); };
    qws.onclose = function () { qaState('bad', '断开，重连中'); qRetry(); };
    qws.onerror = function () { /* onclose 会跟上 */ };
    qws.onmessage = function (e) {
      var d = null; try { d = JSON.parse(e.data); } catch (x) { return; }
      if (d.type === 'qa-init') { qItems = d.questions || []; qClosed = !!d.closed; qSeen = qItems.length; syncCloseBtn(); qaRender(); }
      else if (d.type === 'qa-new') { qItems.push(d.q); if (mode === 'qa') qSeen = qItems.length; qaRender(); }
      else if (d.type === 'qa-cleared') { qItems = []; qSeen = 0; qaRender(); }
      else if (d.type === 'qa-hidden') { qItems = qItems.filter(function (x) { return x.id !== d.id; }); qSeen = Math.min(qSeen, qItems.length); qaRender(); }
      else if (d.type === 'qa-state') { qClosed = !!d.closed; syncCloseBtn(); }
    };
  }
  function qRetry() { if (qtries > 60) { qaState('bad', '连接失败'); return; } qtries++; setTimeout(qConnect, Math.min(1200 * qtries, 8000)); }
  function syncCloseBtn() {
    qaCloseBtn.textContent = qClosed ? '重新开放提问' : '关闭提问';
    qaCloseBtn.classList.toggle('on', qClosed);
  }
  qaCloseBtn.addEventListener('click', function () { qSend({ type: qClosed ? 'qa-open' : 'qa-close' }); });
  // 大屏问题墙滚动：问题多了大屏一屏放不下，讲者在台上用这两颗翻
  document.getElementById('qaUp').addEventListener('click', function () { qSend({ type: 'qa-scroll', dir: -1 }); });
  document.getElementById('qaDown').addEventListener('click', function () { qSend({ type: 'qa-scroll', dir: 1 }); });
  qaClearBtn.addEventListener('click', function () {
    if (!qItems.length) return;
    if (window.confirm('清空大屏上的全部 ' + qItems.length + ' 个问题？此操作不可撤销。')) qSend({ type: 'qa-clear' });
  });
  if (QA_ON) { qConnect(); qaRender(); }

  document.addEventListener('touchmove', function (e) { if (e.scale !== 1) e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
</script>
</body>
</html>
