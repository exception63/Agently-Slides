<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slidesmith Live · 互动管理</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2a2f3a;--fg:#eceef2;--dim:#8b929e;
  --amber:#e0a63c;--ok:#4c9a72;--bad:#c9553d;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
a{color:var(--amber);text-decoration:none}
header{display:flex;align-items:center;gap:14px;padding:18px 26px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:rgba(15,17,21,.94);backdrop-filter:blur(8px);z-index:5}
h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.02em}
h1 small{display:block;font:400 11px/1.4 ui-monospace,Menlo,monospace;color:var(--dim);letter-spacing:.14em;margin-top:2px}
.grow{flex:1}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 0 4px rgba(76,154,114,.16)}
.dot.bad{background:var(--bad);box-shadow:0 0 0 4px rgba(201,85,61,.18)}
#healthTxt{font-size:12.5px;color:var(--dim)}
main{padding:22px 26px 60px;max-width:1180px;margin:0 auto}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:9px;
  padding:8px 14px;font:inherit;font-size:13px;cursor:pointer}
.btn:hover{background:#262b36}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#181818;font-weight:600}
.btn.danger{color:#e08b76}
.btn:disabled{opacity:.42;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.rhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rname{font-size:16px;font-weight:600}
.rid{font:12px/1 ui-monospace,Menlo,monospace;color:var(--dim);background:var(--panel2);
  padding:4px 8px;border-radius:6px}
.badge{font-size:11.5px;padding:3px 9px;border-radius:20px;background:var(--panel2);color:var(--dim)}
.badge.live{background:rgba(76,154,114,.16);color:#6fc79a}
.badge.closed{background:rgba(201,85,61,.15);color:#e08b76}
.stats{display:flex;gap:22px;margin-top:11px;flex-wrap:wrap;font-size:13px;color:var(--dim)}
.stats b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
.links{margin-top:11px;display:flex;gap:16px;flex-wrap:wrap;font:12px/1.7 ui-monospace,Menlo,monospace}
.links span{color:var(--dim)}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--dim);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid #21252e;vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--dim)}
.qlist{margin-top:10px}
.q{padding:10px 12px;border-left:2px solid var(--amber);background:var(--panel2);
  border-radius:0 8px 8px 0;margin-bottom:8px}
.q.hidden{border-left-color:#4a4f5a;opacity:.55}
.q time{display:block;font:11px/1.5 ui-monospace,Menlo,monospace;color:var(--dim);margin-top:4px}
.empty{color:var(--dim);font-size:13.5px;padding:14px 2px}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--fg);
  padding:22px;max-width:420px;width:92vw}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{margin:0 0 14px;font-size:16px}
dialog input{width:100%;box-sizing:border-box;background:var(--panel2);border:1px solid var(--line);
  color:var(--fg);border-radius:8px;padding:10px 12px;font:inherit;font-size:14px;margin-bottom:10px}
dialog input:focus{outline:none;border-color:var(--amber)}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.hint{font-size:12px;color:var(--dim);line-height:1.7;margin:6px 0 0}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#22262f;
  border:1px solid var(--line);border-radius:10px;padding:10px 18px;font-size:13.5px;
  opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
</style></head>
<body>
<header>
  <h1>Slidesmith Live<small>互动管理</small></h1>
  <span class="grow"></span>
  <span class="dot" id="healthDot"></span><span id="healthTxt">连接中…</span>
  <button class="btn primary" id="newBtn">＋ 新建房间</button>
</header>
<main>
  <div id="list"><div class="empty">加载中…</div></div>
</main>

<dialog id="dlg">
  <h3 id="dlgTitle">新建房间</h3>
  <input id="dlgName" placeholder="中文名，例：营销学 2026 秋">
  <input id="dlgId" placeholder="房间号（留空自动生成）">
  <p class="hint">房间号会烘进 slides、决定二维码，<b>建好之后别改</b>。中文名只给你自己看，随时能改。</p>
  <div class="row"><button class="btn" id="dlgCancel">取消</button><button class="btn primary" id="dlgOk">建立</button></div>
</dialog>
<div id="toast"></div>

<script>
var $ = function (s) { return document.querySelector(s); };
var state = { rooms: [], open: null, sessions: {}, items: {} };

function toast(t) { var e = $('#toast'); e.textContent = t; e.classList.add('on'); setTimeout(function () { e.classList.remove('on'); }, 2200); }
function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
function fmt(ts) { if (!ts) return '—'; var d = new Date(ts * 1000); var p = function (n) { return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); }
function dur(a, b) { if (!a) return '—'; var s = Math.max(0, (b || Math.floor(Date.now() / 1000)) - a);
  var m = Math.round(s / 60); return m < 60 ? m + ' 分钟' : (m / 60).toFixed(1) + ' 小时'; }
function api(p, opt) { return fetch(p, opt).then(function (r) { return r.json(); }); }

function render() {
  var box = $('#list');
  if (!state.rooms.length) { box.innerHTML = '<div class="card"><div class="empty">还没有房间。点右上角「＋ 新建房间」建第一个 —— 一门课建一个，二维码烘一次就永远不用换。</div></div>'; return; }
  box.innerHTML = state.rooms.map(function (r) {
    var on = r.online, live = on && on.deck > 0;
    var open = state.open === r.id;
    return '<div class="card" data-room="' + esc(r.id) + '">'
      + '<div class="rhead">'
      +   '<span class="rname">' + esc(r.name || '（未命名）') + '</span>'
      +   '<span class="rid">' + esc(r.id) + '</span>'
      +   (live ? '<span class="badge live">● 正在讲　学生 ' + on.ask + ' 台</span>'
                : '<span class="badge">未开讲</span>')
      +   (r.closed ? '<span class="badge closed">提问已关闭</span>' : '')
      +   '<span class="grow"></span>'
      +   '<button class="btn" data-act="toggle">' + (open ? '收起' : '场次记录') + '</button>'
      + '</div>'
      + '<div class="stats"><span>共 <b>' + r.sessions + '</b> 场</span>'
      +   '<span>累计 <b>' + r.items + '</b> 条提问</span>'
      +   (r.last ? '<span>最近 <b>' + fmt(r.last.started) + '</b></span>' : '')
      +   (live ? '<span>墙上 <b>' + r.wallNow + '</b> 条</span>' : '') + '</div>'
      + '<div class="links"><span>学生扫码</span> ' + location.origin + '/q/' + esc(r.id)
      +   '　<span>你的 iPad</span> ' + location.origin + '/r/' + esc(r.id) + '</div>'
      + '<div class="acts">'
      +   '<button class="btn" data-act="clear"' + (live ? '' : ' disabled') + '>清屏</button>'
      +   '<button class="btn" data-act="' + (r.closed ? 'open' : 'close') + '"' + (live ? '' : ' disabled') + '>'
      +     (r.closed ? '开放提问' : '关闭提问') + '</button>'
      +   '<button class="btn" data-act="rename">改名</button>'
      +   '<button class="btn danger" data-act="delete">删除</button>'
      + '</div>'
      + (open ? sessionsHtml(r.id) : '')
      + '</div>';
  }).join('');
}

function sessionsHtml(rid) {
  var ss = state.sessions[rid];
  if (!ss) return '<div class="empty">读取中…</div>';
  if (!ss.length) return '<div class="empty">这个房间还没有开讲记录。</div>';
  return '<table><thead><tr><th>场次</th><th>开始</th><th>时长</th><th class="n">提问</th><th class="n">在线峰值</th><th class="n">导出</th></tr></thead><tbody>'
    + ss.map(function (s) {
      var opened = state.items[s.id];
      return '<tr data-sess="' + s.id + '">'
        + '<td><a href="#" data-act="items">' + (s.ended ? '' : '● ') + '第 ' + (s.no || s.id) + ' 场</a></td>'
        + '<td>' + fmt(s.started) + '</td><td>' + dur(s.started, s.ended) + '</td>'
        + '<td class="n">' + s.items + '</td><td class="n">' + (s.peak || 0) + '</td>'
        + '<td class="n"><a href="/api/admin/export?session=' + s.id + '&fmt=csv">CSV</a>　'
        +   '<a href="/api/admin/export?session=' + s.id + '&fmt=md">MD</a></td></tr>'
        + (opened ? '<tr><td colspan="6">' + itemsHtml(opened) + '</td></tr>' : '');
    }).join('') + '</tbody></table>';
}

function itemsHtml(items) {
  if (!items.length) return '<div class="empty">这一场没有提问。</div>';
  return '<div class="qlist">' + items.map(function (it) {
    return '<div class="q' + (it.hidden ? ' hidden' : '') + '">' + esc(it.t)
      + '<time>' + fmt(it.ts) + (it.hidden ? '　· 现场已撤下' : '') + '</time></div>';
  }).join('') + '</div>';
}

function refresh() {
  return api('/api/admin/overview').then(function (d) {
    if (!d.ok) throw new Error(d.error || '读取失败');
    state.rooms = d.rooms;
    $('#healthDot').className = 'dot ok';
    $('#healthTxt').textContent = '服务正常 · 已运行 ' + dur(d.now - d.health.uptime, d.now);
    render();
  }).catch(function (e) {
    $('#healthDot').className = 'dot bad';
    $('#healthTxt').textContent = '服务无响应 —— ' + e.message;
  });
}

document.addEventListener('click', function (e) {
  var a = e.target.closest('[data-act]'); if (!a) return;
  var act = a.dataset.act;
  var card = e.target.closest('[data-room]');
  var rid = card && card.dataset.room;
  var tr = e.target.closest('[data-sess]');

  if (act === 'items' && tr) {
    e.preventDefault();
    var sid = +tr.dataset.sess;
    if (state.items[sid]) { delete state.items[sid]; render(); return; }
    api('/api/admin/items?session=' + sid).then(function (d) { state.items[sid] = d.items || []; render(); });
    return;
  }
  if (!rid) return;
  if (act === 'toggle') {
    if (state.open === rid) { state.open = null; render(); return; }
    state.open = rid; render();
    api('/api/admin/sessions?room=' + encodeURIComponent(rid)).then(function (d) {
      state.sessions[rid] = d.sessions || []; render();
    });
    return;
  }
  if (act === 'clear' || act === 'close' || act === 'open') {
    if (act === 'clear' && !confirm('把大屏上的问题全部清空？（历史记录不受影响，仍能在场次里查到）')) return;
    api('/api/admin/control', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ room: rid, action: act }) })
      .then(function (d) { toast(d.ok ? '已发送' : (d.error || '失败')); setTimeout(refresh, 400); });
    return;
  }
  if (act === 'rename') {
    var cur = (state.rooms.filter(function (x) { return x.id === rid; })[0] || {}).name || '';
    var name = prompt('这个房间叫什么？（只给你自己看）', cur);
    if (name == null) return;
    api('/api/admin/room', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'rename', id: rid, name: name }) }).then(function () { refresh(); });
    return;
  }
  if (act === 'delete') {
    if (!confirm('删除房间「' + rid + '」及其全部场次和提问记录？\n这一步不可撤销。')) return;
    api('/api/admin/room', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'delete', id: rid }) })
      .then(function (d) { toast(d.ok ? '已删除' : (d.error || '失败')); state.open = null; refresh(); });
  }
});

var dlg = $('#dlg');
$('#newBtn').addEventListener('click', function () { $('#dlgName').value = ''; $('#dlgId').value = ''; dlg.showModal(); $('#dlgName').focus(); });
$('#dlgCancel').addEventListener('click', function () { dlg.close(); });
$('#dlgOk').addEventListener('click', function () {
  api('/api/admin/room', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'create', id: $('#dlgId').value.trim(), name: $('#dlgName').value.trim() }) })
    .then(function (d) {
      if (!d.ok) { toast(d.error || '建立失败'); return; }
      dlg.close(); toast('已建立房间 ' + d.id); refresh();
    });
});

refresh();
setInterval(refresh, 5000);
</script>
</body></html>
