# 加进 /etc/caddy/Caddyfile —— 放在通配符 *.zhouliying.com 那段**之前**。
# DNS 不用动：Cloudflare 已有 *.zhouliying.com 通配符记录。
# TLS 走 tls internal（回源自签），对应 Cloudflare SSL 模式 "Full"，和站里其余段一致。
live.zhouliying.com {
	tls internal

	header {
		X-Content-Type-Options nosniff
		Referrer-Policy strict-origin-when-cross-origin
		X-Robots-Tag "noindex, nofollow"
		-Server
	}

	# route 保证按书写顺序执行。不用 route 的话 Caddy 会按指令类型重排，
	# forward_auth（本质是 reverse_proxy）会被排到 handle 后面 —— 等于门开在屋里。
	route {
		# ① 学生提问页 / 讲者遥控页 / WebSocket 中转：**绝不能要密码**。
		#    学生扫码就该能提问，加一道门等于把互动本身废掉。
		#    讲者那端的密码由中转自己按房间校验（sha256 哈希），不走这里。
		handle /q/* {
			reverse_proxy 127.0.0.1:8092
		}
		handle /r/* {
			reverse_proxy 127.0.0.1:8092
		}
		handle /ws* {
			reverse_proxy 127.0.0.1:8092
		}
		handle /health {
			reverse_proxy 127.0.0.1:8092
		}

		# ② 登录页和认证接口本身不能要求认证，否则死循环。
		#    复用 MySpace 那套 msauth —— 密码天然是同一个，`myspace passwd` 改一次两处都变。
		#    cookie 是 host-only，所以 live 子域名要各自登录一次（这是安全上正确的行为）。
		handle /login* {
			root * /srv/myspace/.index/auth
			rewrite * /index.html
			header Cache-Control "no-store"
			file_server
		}
		handle /_auth/* {
			reverse_proxy 127.0.0.1:8091
		}

		# ③ 其余（管理台和它的接口）先问 msauth：这人登录了吗？
		forward_auth 127.0.0.1:8091 {
			uri /_auth/verify
		}
		reverse_proxy 127.0.0.1:8092
	}
}
