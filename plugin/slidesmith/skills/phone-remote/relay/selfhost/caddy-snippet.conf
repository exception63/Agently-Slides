# 加进 /etc/caddy/Caddyfile —— 放在通配符 *.zhouliying.com 那段**之前**
# （Caddy 里更具体的 host 本来就优先，但写在前面读起来更清楚）。
#
# DNS 不用动：Cloudflare 已有 *.zhouliying.com 通配符记录。
# TLS 走 tls internal（回源自签），对应 Cloudflare SSL 模式 "Full"，和站里其余段一致。
live.zhouliying.com {
	tls internal
	header {
		X-Content-Type-Options nosniff
		Referrer-Policy strict-origin-when-cross-origin
		X-Robots-Tag "noindex, nofollow"
		-Server
	}
	# WebSocket 升级 Caddy 会自动透传，不用额外配置。
	# 这里**不加 encode** —— 压缩对 WS 无用，对提问页那点 HTML 也没必要。
	reverse_proxy 127.0.0.1:8092
}
