name: SlidesmithRemote
options:
  bundleIdPrefix: com.zlyscu
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  # ---- iPhone：扫码配对 + 把 room 同步给手表 + 自己也能当遥控 ----
  SlidesmithRemote:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zlyscu.slidesmithremote
        INFOPLIST_KEY_CFBundleDisplayName: Slidesmith 遥控
        INFOPLIST_KEY_NSCameraUsageDescription: 扫描电脑上 slides 的配对二维码
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: SlidesmithRemoteWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: Watch

  # ---- Apple Watch：真正的遥控器（分区翻页 + 捏合双击 = 下一页）----
  SlidesmithRemoteWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zlyscu.slidesmithremote.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: Slidesmith
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.zlyscu.slidesmithremote
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        TARGETED_DEVICE_FAMILY: "4"
